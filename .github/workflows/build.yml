name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Regenerate the wrapper so the build never depends on the checked-in
      # gradlew script being byte-perfect (it is checked in, but this step
      # makes CI self-healing).
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # NOTE: this fails with a clear CMake error until the C engine lands
      # under engine/ (see app/src/main/cpp/CMakeLists.txt). That is
      # intentional: the APK cannot build without the engine.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiny-trainer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
